name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }

      - name: Add Firebase config (turns on notifications)
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Notifications: ON"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — APK will work but without notifications"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "salfa-bdaqiqa.apk"

      - uses: actions/upload-artifact@v4
        with: { name: salfa-bdaqiqa-apk, path: salfa-bdaqiqa.apk }

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: السالفة بدقيقة v1.0.${{ github.run_number }}
          files: salfa-bdaqiqa.apk
          make_latest: true
