name: Notify new Instagram posts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      test_message:
        description: "اكتب رسالة تجربة حتى توصل إشعار هسه (اختياري)"
        required: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Time of the previous successful check
        id: since
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=$(gh api "repos/${{ github.repository }}/actions/workflows/notify.yml/runs?status=success&event=schedule&per_page=1" --jq '.workflow_runs[0].run_started_at // empty')
          echo "since=$T" >> "$GITHUB_OUTPUT"

      - name: Check & notify
        working-directory: notifier
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SINCE: ${{ steps.since.outputs.since }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
        run: |
          npm install --silent
          node check-instagram.mjs
